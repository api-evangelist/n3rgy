description: >-
  n3rgy publishes NO first-party client libraries. Its GitHub organisation
  (github.com/n3rgy) has zero public repositories and its own linked repo
  github.com/n3rgy/data returns HTTP 404. The developer guide's "Schemas" page
  lists an (empty) Postman-collection table and no SDK section. Everything below
  is COMMUNITY-BUILT and unaffiliated with n3rgy data limited — recorded here for
  discovery only, with official:false. Note that all three community libraries
  target the LEGACY consumer API (consumer-api.data.n3rgy.com), which n3rgy has
  withdrawn ("unfortunately the consumer API is not longer available (it's a
  regulatory thing)" — github.com/n3rgy org bio), not the current Customer
  Service API V2.
official_sdks: false
official_sdk_count: 0
