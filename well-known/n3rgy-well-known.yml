description: >-
  n3rgy serves NO /.well-known/ discovery documents anywhere. Both API Gateway
  hosts answer a uniform JSON 404 ({"message":"Resource not found."}) for every
  path. The two web hosts are single-page / static-site shells that answer HTTP
  200 with text/html for ANY path — those are false positives, recorded as
  present-but-not-a-real-document and NOT saved. No security.txt, no OIDC
  discovery, no OAuth authorization-server metadata, no api-catalog, no
  ai-plugin. This is consistent with the API's auth model: a back-office-issued
  x-api-key header, with no OAuth or OIDC anywhere in the estate.
