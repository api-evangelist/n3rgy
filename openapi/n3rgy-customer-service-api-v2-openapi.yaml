    ReadInventorySuccessResponseNoQueryParams:
      type: object
      properties:
        status:
          type: integer
          description: Status of the submitted request.
          example: 200
        uuid:
          type: string
          description: Universally unique identifier for each request being processed.
          example: 46ff4ffd-cfb0-4705-acaa-14a780973540
        uri:
          type: string
          description: URI (Uniform Resource Identifier) for the file containing the results of the query being processed.
          example: https://46ff4ffd-cfb0-4705-acaa-14a780973540.json
    MeteredValues:
      type: object
      required:
        - timestamp
      properties:
        timestamp:
          description: Timestamp of the reading in the ISO8601 format.
          type: string
          format: date
          example: "2020-11-10T17:07:01.580Z"
        primaryValue:
          description: "The consumption/production reading of the meter.
            It should be a decimal with a decimal point."
          type: number
          format: double
          example: 0.25
        secondaryValue:
          description:
            "In hybrid meters should be filled with the second element consumption/production.
            It should be a decimal with a decimal point."
          type: number
          format: double
          example: 0.25
        additionalInformation:
          description:
            'A textual information that may be relevant for the given timestamp.
            Only a set of values are acceptable.
            The values will be translated into:
            VALID_VALUE = ""
            INVALID_VALUE = "invalid value"
            VALUE_NOT_AVAILABLE_IN_SMSO = "value not available in SMSO"
            INVALID_TIMESTAMP = "invalid timestamp"'
          type: string
          enum:
            - VALID_VALUE
            - INVALID_VALUE
            - VALUE_NOT_AVAILABLE_IN_SMSO
            - INVALID_TIMESTAMP
          example: VALID_VALUE
        type:
          description: The type classification of the reading value
          type: string
          enum: [ "HALF_HOURLY", "TOTAL_BY_PHASE", "TOTAL", "REVERSE", "Q4", "Q3", "Q2", "Q1", "Q3-Q2", "Q3+Q4", "Q2-Q3", "Q2+Q4", "Q2+Q3", "Q1-Q4", "Q1+Q4", "Q1+Q3", "Q1+Q2", "NET", "LEADING", "FORWARD", "LAGGING" ]
          example: "TOTAL"
    UploadDevice:
      type: object
      required:
        - deviceId
        - deviceManufacturer
        - importMPxN
        - smso
      properties:
        commissionedDate:
          description:
            "The date in which the device was commissioned in UTC ISO8601 format
            (e.g.: 2023-01-24T05:29:36Z). If no time of the day is
            provided, it will default to midnight (2023-01-24Z)."
          type: string
          format: date
          example: "2023-01-24T05:29:36Z"
        deviceId:
          description:
            Unique Identifier that can identify the device to the user.
            It will be the MAC address in the case of a SMETS device,
            and it will be the meter serial number in the case of an AMR device.
          type: string
          example: 0CA2F400005CDFA3
        deviceManufacturer:
          description: Identifies the meter manufacturer name.
          type: string
          example: MyBrand
        deviceModel:
          description: Identifies the meter manufacturer model.
          type: string
          example: AA.BB.CC
        deviceStatus:
          description: The status of the meter.
          default: UNDEFINED
          type: string
          enum:
            - PENDING
            - WHITELISTED
            - INSTALLED_NOT_COMMISSIONED
            - COMMISSIONED
            - DECOMMISSIONED
            - WITHDRAWN
            - SUSPENDED
            - RECOVERY
            - RECOVERED
            - UNDEFINED
          example: COMMISSIONED
        deviceType:
          description: "Device type enum. Should follow SMETS standards (e.g.: ESME, GSME, ESME_EXPORT)."
          type: string
          enum:
            - ESME
            - GSME
            - ESME_EXPORT
          example: ESME
        exportMPAN:
          description: Meter Point Access Number for export.
          type: string
          pattern: "[0-9]{13}||[0-9]{9}"
          example: 9876580000483
        firmwareVersion:
          description: The firmware version of the meter.
          type: string
          example: 1100EEFF
        importMPxN:
          description: Meter Point Identifier Number for import.
          type: string
          pattern: "[0-9]{13}||[0-9]{9}"
          example: 9876580000483
        postCode:
          description: The post code where the meter is installed.
          type: string
          example: SW1A 1AA
        address:
          description: The address where the meter is installed.
          type: string
          maxLength: 30
          example: Someones street,7H,York
        smso:
          description: This identifies the SMSO managing the meter.
            In order to protect the data.n3rgy automated reads from existing SMSOs (Secure, DCC)
            these values will be forbidden when importing devices through the GUA interface.
            Thus any values not in ('Secure', 'DCC') will be allowed.
          type: string
          example: AMR
    AMRDevice:
      allOf:
        - type: object
          properties:
            hanId:
              description:
                This is the property identifier. Will be generated when a new device is added.
                This field shall not be specified for create or update operations. Shall only be defined on read operations.
              type: string
              example: A0DA9479AF7E2F486C37B0E23ADFEF4A1D6954214E249A3E9EB1D2EB711C40E7
        - $ref: "#/components/schemas/UploadDevice"
    SetDefaultsBodyRequest:
