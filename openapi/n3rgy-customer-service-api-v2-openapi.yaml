components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      x-amazon-apigateway-api-key-source: HEADER
  schemas:
    RetrieveConsentedMPxNsSuccessResponse:
      type: object
      properties:
        resource:
          type: string
          description: The request's resource path.
          example: "/"
        responseTimestamp:
          type: string
          description: The timestamp when this response was created.
          example: "2020-11-10T17:07:01.580Z"
        startAt:
          type: integer
          description: parameter startAt.
          example: 0
        maxResults:
          type: integer
          description: parameter maxResults.
          example: 100
        total:
          type: integer
          description: number of MPxNs retrieved.
          example: 1
        entries:
          type: array
          items:
            type: string
            description: consented MPxNs.
            pattern: "[0-9]{13}||[0-9]{9}"
            example: "1230267891094"
    ParamStartAtErrorResponse:
      description: Response for the Customer Service Api V2 HTTP Bad Request error.
      type: object
      properties:
        message:
          description: Error message.
          type: string
          example: Parameter startAt must be an integer.
    ParamMaxResultsErrorResponse:
      description: Response for the Customer Service Api V2 HTTP Bad Request error.
      type: object
      properties:
        message:
          description: Error message.
          type: string
          example: Parameter maxResults must be an integer.
    RetrieveUtilitiesSuccessResponse:
      type: object
      properties:
        resource:
          description: The url resource with the MPxN
          type: string
          example: "/mpxn/1234567891012"
        responseTimestamp:
          description: The timestamp of the response
          type: string
          example: "2022-04-10T17:07:01.580Z"
        entries:
          description: The utilities of the han
          type: array
          items:
            type: string
          example: "['electricity', 'gas']"
    ConsentNotFoundResponse:
      description: Response when the Consent was not found for the given MPxN.
      type: object
      properties:
        errors:
          allOf:
            - $ref: "#/components/schemas/ConsentNotFoundError"
            - description: List of errors.
    ConsentNotFoundError:
      description: Consent Not Found error.
      type: array
      items:
        properties:
          code:
            description: Error code - 403.
            format: int32
            type: integer
            example: 403
          message:
            description: Error message.
            type: string
            example: "Consent for the given MPxN not found."
    RetrieveReadingTypesSuccessResponse:
      type: object
      properties:
        resource:
          description: The url resource with the MPxN
          type: string
          example: "/mpxn/1234567891012"
        responseTimestamp:
          description: The timestamp of the response
          type: string
          example: "2022-04-10T17:07:01.580Z"
        devices:
          description: The devices of the han with reading types
          type: array
          items:
            type: object
            properties:
              deviceId:
                description: The id of the device
                type: string
                example: "01-0A-00-00-00-00-FF-03"
              availableDataTypes:
                description: The available reading types of the device
                type: array
                items:
                  type: string
                example: "['consumption', 'tariff']"
    RetrieveMPxNAvailabilitySuccessResponse:
      type: object
      properties:
        resource:
          type: string
          description: The request's resource path
          example: "/"
        responseTimestamp:
          type: string
          description: The timestamp when this response was created
          example: "2020-11-10T17:07:01.580Z"
        mpxn:
          type: string
          description: Path parameter MPxN
          example: "1230267891094"
        deviceType:
          type: string
          description: The device type
          example: "ESME"
        deviceId:
          description: The device id
          type: string
          example: "01-0A-00-00-00-00-FF-03"
        deviceStatus:
          type: string
          description: The device status
          example: "Commissioned"
        deviceManufacturer:
          type: string
          description: The device manufacturer code
          example: "106C"
        deviceModel:
          type: string
          description: The device model
          example: "10E2A100"
        deviceGbcsVersion:
          type: string
          description: The device gbcs version
          example: "3.2"
        deviceFirmwareVersion:
          type: string
          description: The device firmware version
          example: "0314B600"
        smetsChtsVersion:
          type: string
          description: The device smets chts version
          example: "V4.2"
        multipleMatchingResults:
          type: boolean
          description: True when more than one meter for meter type is found for the given HAN (e.g. two ESMEs)
        propertyFilter:
          type: object
          properties:
            postCode:
              description: The post code where the meter is installed
              type: string
              example: SW1A 1AA
            addressIdentifier:
              description: The address where the meter is installed
              type: string
              maxLength: 30
              example: Someones street,7H,York
    ParamMPxNErrorResponse:
      description: Response for the Customer Service Api V2 HTTP Bad Request error.
      type: object
      properties:
        message:
          description: Error message.
          type: string
          example: An MPxN must be provided, and must be a value between 1 and 13 digits.
    NotFoundMpxnResponse:
      description: Response when the MPxN was not found or not associated with a HAN.
      type: object
      properties:
        errors:
          allOf:
            - $ref: "#/components/schemas/NotFoundMpxnError"
            - description: List of errors.
    NotFoundMpxnError:
      description: Mpxn Not Found error.
      type: array
      items:
        properties:
          code:
            description: Error code - 404.
            format: int32
            type: integer
            example: 404
          message:
            description: Error message.
            type: string
            example: "There is no available information of meters associated with the received MPxN."
    MPxNNotAssociatedWithAHANError:
      description: Mpxn not associated with any HAN.
      type: object
      properties:
        message:
          description: Error message.
          type: string
          example: "The received MPxN is associated with a device that is not associated to any premises."
    RetrieveDataUpdateFrequenciesSuccessResponse:
      type: object
      properties:
        resource:
          type: string
          description: The request's resource path.
          example: "get-update-frequencies/1234567891001"
        responseTimestamp:
          type: string
          description: The timestamp when this response was created.
          example: "2020-11-10T17:07:01.580Z"
        status:
          type: integer
          description: The request's status code.
          example: 200
        utilities:
          type: array
          items:
            type: object
            properties:
              utilityType:
                type: string
                description: The utility type
                example: "Electricity"
              devices:
                description: The devices of the han with the utility type
                type: array
                items:
                  type: object
                  properties:
                    deviceId:
                      type: string
                      description: The id of the device
                      example: "01-0A-00-00-00-00-FF-03"
                    updateType:
                      type: string
                      description: The utility type plus reading type
                      example: "electricity#import"
                    updateFrequency:
                      type: string
                      description: The update frequency for the update type
                      example: "24h"
    RetrieveReadingDataSuccessResponse:
      type: object
      properties:
        resource:
          description: The url resource used
          type: string
          example: "/mpxn/1234567891000/utility/electricity/readingType/consumption?start=202203100830&end=202203111230"
        responseTimestamp:
          description: The timestamp of the response
          type: string
          example: "2022-04-10T17:07:01.580Z"
        availableCacheRange:
          description: The timestamp available in the cache table
          type: object
          properties:
            start:
              description: The minimum start date
              type: string
              example: "202104262300"
            end:
              description: The maximum end date
              type: string
              example: "202204260000"
        start:
          description: The start date being used to retrieve data from Dynamo DB
          type: string
          example: "202203100830"
        end:
          description: The end date being used to retrieve data from Dynamo DB
          type: string
          example: "202203111230"
        granularity:
          description: The granularity of the response
          type: string
          example: "halfhour"
        unit:
          description: The unit of measure for the readings
          type: string
          example: "kWh"
        devices:
          description: The devices of the han with all the readings
          type: array
          items:
            type: object
            properties:
              deviceId:
                description: The id of the device
                type: string
                example: "01-0A-00-00-00-00-FF-03"
              values:
                description: The available readings for the device
                type: array
                items:
                  type: object
                  properties:
                    primaryValue:
                      description: The primary value for the reading
                      type: number
                      example: 11.183
                    secondaryValue:
                      description: The secondary value for the reading
                      type: number
                      example: 9.703
                    timestamp:
                      description: The timestamp for the reading
                      type: string
                      example: "2022-03-10"
                    totalHHBlocks:
                      description: The number of half-hour records used in the calculation (when the granularity = day)
                      type: integer
                      example: 48
                    unit:
                      description: The unit of measure for this specific reading value
                      type: string
                      example: "kWh"
                    type:
                      description: The type classification of the reading value
                      type: string
                      enum: [ "HALF_HOURLY", "TOTAL_BY_PHASE", "TOTAL", "REVERSE", "Q4", "Q3", "Q2", "Q1", "Q3-Q2", "Q3+Q4", "Q2-Q3", "Q2+Q4", "Q2+Q3", "Q1-Q4", "Q1+Q4", "Q1+Q3", "Q1+Q2", "NET", "LEADING", "FORWARD", "LAGGING" ]
                      example: "TOTAL"
    RetrievePrimaryElementsResponse:
      type: object
      properties:
        resource:
          description: The url resource used
          type: string
          example: "/1234567891000/electricity/consumption"
        responseTimestamp:
          description: The timestamp of the response
          type: string
          example: "2022-04-10T17:07:01.580Z"
        entries:
          description: The primary elements of the han
          type: array
          items:
            description: The id of the device
            type: integer
            example: 1
    CreateExportProfilesRequest:
