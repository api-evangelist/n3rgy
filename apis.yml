apis:
- aid: n3rgy:customer-service-api-v2
  name: n3rgy Customer Service API V2
  description: >-
    The consent-scoped smart-meter data API of the n3rgy platform. A business holding a valid
    n3rgy API key lists the properties (MPxNs) it has active consent for, discovers which
    utilities (electricity, gas) and reading types (consumption, production, tariff) are
    available for each, and retrieves the underlying half-hourly data. The same contract also
    covers meter update-frequency control, MPxN and address lookup, read-inventory / firmware
    and last-communications checks, on-demand "update now" fetches, push-notification
    configuration, and an upload/devices surface for non-DCC device data. Every operation is
    secured with the x-api-key header; consent-bearing operations additionally validate that
    an active consent exists for the HAN behind the given MPxN. A free sandbox with
    demonstration MPxNs mirrors the live contract on a separate host.
  humanURL: https://customer-api-user-manuals.data.n3rgy.com/
  baseURL: https://api-v2.data.n3rgy.com
