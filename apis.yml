name: n3rgy
kind: company
description: >-
  n3rgy data limited is a United Kingdom smart-energy data platform, registered in England
  (No. 11712674) and owned by Smart Metering Systems Ltd. It sits between Great Britain's
  mandated smart-metering infrastructure — the DCC network, SMETS2 home area networks (HANs),
  and the ESME/GSME electricity and gas meters behind them — and the organisations that want
  to read from it, letting a business collect consumption, production, and tariff data for a
  property (addressed by MPAN/MPRN, collectively MPxN) once the occupant has granted consent,
  without that business having to become a DCC user in its own right. Its API posture is public
  in documentation and closed in access: a genuinely anonymous MkDocs developer guide and a
  complete OpenAPI 3.0.1 contract for the Customer Service API V2 are served to anyone, while
  every operation is x-api-key gated and live keys must be enabled by the n3rgy back office
  after a business sign-up. Britain mandated the metering infrastructure, not a consumer data
  right, so nothing here is a Consumer Data Right or Green Button implementation — n3rgy
  publishes no open grid or market data at all, and the formerly public consumer API is,
  by the company's own statement, no longer available.
