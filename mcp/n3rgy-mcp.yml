description: 'n3rgy operates no MCP server. This is a CANDIDATE tool surface derived mechanically from
  the 26 operations of the Customer Service API V2 so an agent builder can stand one up without guessing.
  Every tool below inherits its real input schema from the named operation''s parameters and requestBody
  in the OpenAPI — nothing is invented. Two caveats an implementer must carry through: (1) every call
  needs an x-api-key issued and enabled by the n3rgy back office, and (2) the consent-bearing tools additionally
  require an ACTIVE end-customer consent for the HAN behind the MPxN, so a tool returning 403 "Consent
  for the given MPxN not found." is a consent gap, not an auth failure.'
