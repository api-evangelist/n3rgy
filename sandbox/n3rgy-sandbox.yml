description: >-
  n3rgy separates test from live by HOST, not by key prefix: the sandbox is a
  second AWS API Gateway deployment of the identical Customer Service API V2
  contract at https://api-v2-sandbox.data.n3rgy.com, declared as the second
  servers[] entry in the OpenAPI. Every sandbox endpoint "presents the same
  definition and behaviour" as its live counterpart and applies the same
  authentication and consent validation. What makes the sandbox usable is a
  published estate of DEMONSTRATION PROPERTIES — fixed MPxNs with pre-granted
  consent, real UK postcodes and addresses, device IDs, IHD MAC addresses and
  tariff availability — captured verbatim below from the developer guide. These
  are n3rgy's published test fixtures; nothing here is invented.
  The sandbox tier is free; the business page describes it as shipping
  "thousands of demonstration properties", and a paid upgrade to live data is
  arranged by contacting the company.

modes:
  - name: sandbox
    host: https://api-v2-sandbox.data.n3rgy.com
    key: separate sandbox API key
    free: true
    provisioning: >-
      "Access to the Customer Service API Sandbox must be enabled for the user's
      sandbox API key by the n3rgy data backoffice." Start with the business
      sign-up form at https://data.n3rgy.com/business-sign-up.
  - name: live
    host: https://api-v2.data.n3rgy.com
    key: separate live API key
    free: false
    provisioning: >-
      "Access to the Customer Service API must be enabled for the user's live API
      key by the n3rgy data backoffice." Upgrade is arranged by contacting n3rgy;
      there is no self-serve checkout.

separation:
  mechanism: hostname
  key_prefixes: none published
  notes: >-
    There are no sk_test_/sk_live_ style prefixes. A key is bound to an
    environment by back-office provisioning; the client selects the environment by
    choosing the base URL.

authentication:
  header: x-api-key
  same_as_live: true
  consent_validation: >-
    Applied in the sandbox exactly as in live — the demonstration MPxNs below
    ship with consent already granted so the consent-bearing endpoints return
    data.
  docs: https://customer-api-user-manuals.data.n3rgy.com/sandbox-authentication/

limitations:
  - >-
    check-firmware is NOT available in the sandbox (change log 1.11); the
    sandbox Read Inventory page warns: "Please, do not use the check-firmware or
    last-communications parameters. It will not work and returns an error."
  - >-
    Sandbox readings deliberately contain GAPS (change log 1.14) so clients are
    forced to handle missing half-hourly intervals.
  - >-
    No GSME cache in the sandbox (change log 1.9).
  - >-
    V1 Sandbox is deprecated — "please contact Support (https://support.n3rgy.com)".
    Only the V2 sandbox host is current.

