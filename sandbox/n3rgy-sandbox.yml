device_type_glossary:
  ESME: Electricity Smart Metering Equipment (the electricity meter)
  ESME_EXPORT: Export-registered electricity meter (generation / production)
  GSME: Gas Smart Metering Equipment (the gas meter)
  GPF: Gas Proxy Function
  CPF: Communications Proxy Function
  CHF: Communications Hub Function
  IHD: In-Home Display
  EXPORT: Export MPAN registered against the same physical meter

smso_glossary:
  DCC: Data Communications Company — the licensed GB smart-metering network
  SMS: Smart Metering Systems (non-SMETS devices, change log 1.14)

worked_examples:
  - name: List the properties your sandbox key has consent for
    operationId: RetrieveConsentedMPxNs
    request: GET https://api-v2-sandbox.data.n3rgy.com/?startAt=0&maxResults=100
    headers: {x-api-key: '<your sandbox key>'}
  - name: Discover which utilities a demo property has
    operationId: RetrieveConsentedMPxNUtilities
    request: GET https://api-v2-sandbox.data.n3rgy.com/mpxn/1234567891000
  - name: Pull half-hourly electricity consumption for a demo property
    operationId: RetrieveDataForReadingType
    request: >-
      GET https://api-v2-sandbox.data.n3rgy.com/mpxn/1234567891000/utility/electricity/readingtype/consumption?start=20240101&end=20240102&granularity=halfhour
  - name: Pull a tariff in RAW switching-table form
    operationId: RetrieveDataForReadingType
    request: >-
      GET https://api-v2-sandbox.data.n3rgy.com/mpxn/1234567891000/utility/electricity/readingtype/tariff?outputFormat=raw
    note: >-
      Use an MPxN with has_tariff true. 1099999999990 and 1099999999981 have
      has_tariff false and are the negative fixtures.
  - name: Read the DCC device inventory for a demo property
    operationId: ReadInventory
    request: POST https://api-v2-sandbox.data.n3rgy.com/read-inventory
    body: '{"mpxns": ["1100000000001"], "uprns": [], "deviceIds": []}'
    note: >-
      Use the sandbox_read_inventory fixtures, not the consented MPxNs. Do NOT
      set last-communications or check-firmware in the sandbox.

